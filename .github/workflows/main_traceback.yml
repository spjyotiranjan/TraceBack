# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - TraceBack

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore TraceBack.slnx

      - name: Build solution
        run: dotnet build TraceBack.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TraceBack.slnx --configuration Release --no-build --no-restore

      - name: Publish the web app
        run: dotnet publish src/TraceBack/TraceBack.csproj --configuration Release --no-restore --output publish -p:DebugType=None

      - name: Assemble Windows deployment package
        shell: pwsh
        run: |
          $publishRoot = (Resolve-Path -LiteralPath 'publish').Path
          $packageRoot = Join-Path $PWD 'package'
          Get-ChildItem -LiteralPath $publishRoot -Recurse -File | ForEach-Object {
            $relativePath = $_.FullName.Substring($publishRoot.Length + 1)
            if ($_.Extension -ne '.pdb' -and
                ($relativePath -notmatch '^runtimes[\\/]' -or
                 $relativePath -match '^runtimes[\\/]win-(x86|x64)[\\/]')) {
              $target = Join-Path $packageRoot $relativePath
              New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $target
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $packageRoot 'TraceBack.dll'))) {
            throw 'Deployment package is missing TraceBack.dll.'
          }

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: package
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_14D82EA65B4C4C8FB2A02E019DF09480 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B7124AACAE8349F7A93586FC4C0351D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DD5D6BEDA64F43599159631B83FE27DA }}

      - name: Run the deployed package without extracting it
        shell: pwsh
        run: |
          $siteIds = @(az webapp list --query "[?name=='TraceBack'].id" --output tsv |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0 -or $siteIds.Count -ne 1) {
            throw 'Expected exactly one TraceBack App Service in the Azure subscription.'
          }
          az webapp config appsettings set --ids $siteIds[0] --settings WEBSITE_RUN_FROM_PACKAGE=1 --output none
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not enable run-from-package on the TraceBack App Service.'
          }

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TraceBack'
          slot-name: 'Production'
          package: package

